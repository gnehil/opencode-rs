[workspace]
resolver = "2"
members = [
    "crates/opencode",
    "crates/opencode-sdk",
    "crates/opencode-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anomalyco/opencode-rs"

[workspace.dependencies]
# Shared dependencies for all crates
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP
rmcp = { version = "0.1", features = ["client", "transport-child-process", "transport-sse"] }
